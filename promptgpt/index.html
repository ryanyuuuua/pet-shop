function makePrompt(ci,mi){const c=C[ci],m=M[mi],id='P'+String(ci*25+mi+1).padStart(4,'0');const visual=ci>=28&&ci<=38;return{id,ci,mi,title:`${c[0]} · ${m[0]}`,desc:`${m[1]}。重點處理：${c[2]}。`,tags:[c[1],m[0],visual?'Visual':'Text'],prompt:`你是一位${c[3]}。你的任務是：${m[1]}，主題屬於「${c[0]}」。\n\n【核心目標】\n針對 {{目標/題目}}，在 {{使用情境}} 中產出可以直接使用、不是概念草稿的專業成品。必須特別處理：${c[2]}。\n\n【你會收到的輸入】\n- 目標：{{目標}}\n- 背景/品牌/受眾：{{背景}}\n- 已有素材：{{素材，沒有可寫「無」}}\n- 限制：{{時間、預算、平台、字數、技術或風格限制}}\n- 參考：{{可選}}\n\n【工作協議】\n1. 先把輸入轉成清楚的成功標準；資訊不足時，列出最合理假設，不要停在提問。\n2. 從專家角度辨認最容易失敗的 3–5 點，先避開。\n3. ${m[1]}，不要只給一般建議；必須做出具體內容、結構、例子或規格。\n4. 每個重大決定都要能解釋「為甚麼這樣做」以及它改善甚麼。\n5. 主動刪除空泛、重複、AI 味、過度堆砌形容詞與無法執行的內容。\n${visual?'6. 視覺輸出必須明確寫出主體、環境、構圖、鏡頭/焦段、光線、材質、色彩、情緒、細節密度、比例與負面限制；避免只寫 8K、masterpiece 等空泛詞。':'6. 文字/策略輸出必須有清楚層級、可操作步驟、必要例子與驗收方法。'}\n\n【輸出格式】\nA. 一句話最佳方向\nB. 關鍵判斷與假設\nC. 完整成品/方案\nD. 3 個高價值替代版本或變體\nE. 風險與邊界情況\nF. 最終 QA\n\n【品質門檻】\n以 100 分自評：準確 20、專業深度 20、可直接使用 20、針對性 15、清晰 10、原創 10、細節 5。低於 90 分時先自行修正再輸出。不要展示冗長內部思考，只展示結論、必要理由與成品。`};}

$('#cats').innerHTML=C.map((c,i)=>`<button class="cat" data-cat="${i}">${c[0]} <span class="count">25</span></button>`).join('');document.querySelectorAll('.cat').forEach(b=>b.onclick=()=>setCat(b.dataset.cat));
$('#q').oninput=e=>{query=e.target.value.trim();aiCat=null;render()};document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{$('#q').value=b.dataset.q;query=b.dataset.q;selected='all';render()});
$('#close').onclick=closePrompt;$('#overlay').onclick=e=>{if(e.target.id==='overlay')closePrompt()};$('#copy').onclick=async()=>{await navigator.clipboard.writeText(current.prompt);$('#copy').textContent='✓ 已複製';setTimeout(()=>$('#copy').textContent='複製完整 Prompt',1300)};$('#favorite').onclick=()=>{fav.has(current.id)?fav.delete(current.id):fav.add(current.id);localStorage.setItem('pg-fav',JSON.stringify([...fav]));$('#favorite').textContent=fav.has(current.id)?'★ 已收藏':'☆ 收藏';render()};$('#share').onclick=async()=>{const u=location.href.split('#')[0]+'#'+current.id;if(navigator.share)await navigator.share({title:current.title,url:u});else{await navigator.clipboard.writeText(u);$('#share').textContent='✓ 已複製連結'}};
$('#menu').onclick=()=>$('#side').classList.toggle('open');$('#theme').onclick=()=>{document.body.classList.toggle('dark');localStorage.setItem('pg-dark',document.body.classList.contains('dark')?'1':'0')};if(localStorage.getItem('pg-dark')==='1')document.body.classList.add('dark');
$('#ai').onclick=async()=>{const text=$('#q').value.trim();if(!text){$('#status').textContent='先輸入你想做嘅嘢。';return}$('#status').textContent='AI 正在理解搜尋意圖… 第一次可能要下載本機模型';$('#ai').disabled=true;try{const T=await import('https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2/+esm');const f=await T.pipeline('feature-extraction','Xenova/all-MiniLM-L6-v2',{quantized:true});const vec=async s=>Array.from((await f(s,{pooling:'mean',normalize:true})).data);const qv=await vec(text);let best=-1,bs=-9;for(let i=0;i<C.length;i++){const cv=await vec(`${C[i][0]} ${C[i][1]} ${C[i][2]}`);let d=0;for(let j=0;j<qv.length;j++)d+=qv[j]*cv[j];if(d>bs){bs=d;best=i}}aiCat=best;query=text;render();$('#status').textContent=`AI 判斷最相關：${C[best][0]} · 已結合全文搜尋排序`; }catch(e){aiCat=null;query=text;render();$('#status').textContent='AI 模型未能載入，已自動使用本地智能搜尋。';}finally{$('#ai').disabled=false}};
render();if(location.hash&&/^#P\d{4}$/.test(location.hash))setTimeout(()=>openPrompt(location.hash.slice(1)),50);
</script>
</body></html>
