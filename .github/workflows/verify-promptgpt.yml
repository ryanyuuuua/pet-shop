name: Verify PromptGPT Live

on:
  push:
    paths:
      - '.github/workflows/verify-promptgpt.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify fixed PromptGPT CDN and Gemini integration
        shell: bash
        run: |
          set -euo pipefail
          SHA='e1181eecf0f3c1234e9f0bbb402c753459acc1ee'
          LIVE="https://rawcdn.githack.com/ryanyuuuua/pet-shop/$SHA/promptgpt/gemini.html"
          SRC="https://raw.githubusercontent.com/ryanyuuuua/pet-shop/$SHA/promptgpt/gemini.html"

          LIVE_CODE=$(curl -sS -L --max-time 30 -o /tmp/promptgpt-live.html -w '%{http_code}' "$LIVE")
          SOURCE_CODE=$(curl -sS -L --max-time 30 -o /tmp/promptgpt-source.html -w '%{http_code}' "$SRC")
          echo "LIVE_HTTP_STATUS=$LIVE_CODE"
          echo "SOURCE_HTTP_STATUS=$SOURCE_CODE"
          test "$LIVE_CODE" = "200"
          test "$SOURCE_CODE" = "200"
          grep -q 'PromptGPT' /tmp/promptgpt-live.html
          grep -q '1000 Premium Prompts' /tmp/promptgpt-live.html
          grep -q 'gemini-3.8-flash' /tmp/promptgpt-live.html
          grep -q 'Gemini 驗證失敗' /tmp/promptgpt-live.html
          if grep -q "temperature:.1" /tmp/promptgpt-live.html; then
            echo 'OLD_TEMPERATURE_CONFIG_FOUND'
            exit 1
          fi
          cmp -s /tmp/promptgpt-live.html /tmp/promptgpt-source.html
          echo 'FIXED_CDN_MATCHES_SOURCE=PASS'
          echo 'GEMINI_3_8_MARKERS=PASS'
          echo 'PROMPTGPT_FIXED_VERIFY=PASS'
