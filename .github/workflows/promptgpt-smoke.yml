name: PromptGPT Smoke Test
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Vercel build
        run: sleep 15
      - name: Verify public probe
        run: |
          set -e
          BASE='https://promptgpt-public-probe-ryans-projects-9a0ab3e7.vercel.app'
          H=$(mktemp)
          CODE=$(curl -sS -L -o "$H" -w '%{http_code}' "$BASE/")
          echo "HOME_STATUS=$CODE"
          cat "$H"; echo
          test "$CODE" = '200'
          grep -q 'PUBLIC_PROBE_OK' "$H"
          B=$(mktemp)
          API_CODE=$(curl -sS -L -o "$B" -w '%{http_code}' "$BASE/api/ping")
          echo "API_STATUS=$API_CODE"
          cat "$B"; echo
          test "$API_CODE" = '200'
          grep -q '"ok":true' "$B"
