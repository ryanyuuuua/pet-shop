name: Apply PromptGPT v5 Simplification

on:
  push:
    branches: [main]
    paths:
      - 'promptgpt/simplify_v5.py'
      - '.github/workflows/apply-promptgpt-v5.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  simplify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply simplification
        run: python promptgpt/simplify_v5.py
      - name: Verify titles, prompts and JavaScript
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          h=Path('promptgpt/gemini.html').read_text()
          script=h.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/compile.js').write_text('new Function('+json.dumps(script)+'); console.log("FULL_SCRIPT_SYNTAX=PASS");')
          start=script.index('const C=')
          end=script.index('const ALL=buildLibrary();',start)+len('const ALL=buildLibrary();')
          segment=script[start:end]
          qa=r'''
          console.log('RUNTIME_ALL='+ALL.length);
          console.log('RUNTIME_QA='+JSON.stringify(window.__PROMPTGPT_QA));
          console.log('TITLE_SAMPLE='+ALL.slice(0,20).map(x=>x.title).join(' || '));
          console.log('PROMPT_SAMPLE='+ALL[0].prompt.slice(0,900).replace(/\n/g,' / '));
          if(ALL.length!==2048)process.exit(51);
          if(window.__PROMPTGPT_QA.minQuality<94)process.exit(52);
          if(!ALL.every(p=>p.title.includes(' · ')))process.exit(53);
          if(ALL.some(p=>/由零做好|做到可以正式使用|先查清楚資料|Master Build|Expert Audit|Production Ready/.test(p.title)))process.exit(54);
          if(!ALL.every(p=>p.prompt.includes('【請交給我】')))process.exit(55);
          if(!ALL.every(p=>p.prompt.includes('簡單、直接的中文')))process.exit(56);
          if(ALL.some(p=>p.title.length>36))process.exit(57);
          console.log('V5_SIMPLE_TITLE_QA=PASS');
          console.log('V5_SIMPLE_PROMPT_QA=PASS');
          '''
          Path('/tmp/runtime.js').write_text('global.window={};\n'+segment+qa)
          PY
          node /tmp/compile.js
          node /tmp/runtime.js
          grep -q '講你想做咩，PromptGPT 會直接幫你搵最適合嘅 Prompt。' promptgpt/gemini.html
          grep -q '\${_catLabel(c\[0\])}' promptgpt/gemini.html
      - name: Commit website
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- promptgpt/gemini.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add promptgpt/gemini.html
          git commit -m 'Make PromptGPT titles short and obvious'
          git push
