name: Apply PromptGPT v6.2 Final Human Titles

on:
  push:
    branches: [main]
    paths:
      - 'promptgpt/refine_titles_v6_2.py'
      - '.github/workflows/apply-promptgpt-title-v6-2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final semantic polish
        shell: bash
        run: |
          set -euo pipefail
          python promptgpt/refine_titles_v6_2.py
      - name: Final semantic QA
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          h=Path('promptgpt/gemini.html').read_text()
          script=h.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/compile.js').write_text('new Function('+json.dumps(script)+'); console.log("FULL_SCRIPT_SYNTAX=PASS");')
          start=script.index('const C=')
          end=script.index('const ALL=buildLibrary();',start)+len('const ALL=buildLibrary();')
          segment=script[start:end]
          qa=r'''
          function vlen(s){return Array.from(String(s).replace(/\s+/g,'').replace(/[A-Za-z0-9.+#_-]+/g,'XX')).length}
          const lens=ALL.map(x=>vlen(x.title));
          const avg=lens.reduce((a,b)=>a+b,0)/lens.length;
          const target=lens.filter(n=>n>=7&&n<=11).length;
          const over=ALL.filter(x=>vlen(x.title)>13);
          const bad=ALL.filter(x=>/在網站加入網上付款|履歷重寫|數學解題|翻譯繁中香港化|製作客廳|製作主角設計|研究深度研究|整理好前端白畫面/.test(x.title));
          const punct=ALL.filter(x=>/[·｜:：]/.test(x.title));
          const sameCatDup=ALL.length-new Set(ALL.map(x=>x.ci+'|'+x.title)).size;
          console.log('RUNTIME_ALL='+ALL.length);
          console.log('RUNTIME_QA='+JSON.stringify(window.__PROMPTGPT_QA));
          console.log('TITLE_AVG_VISUAL_LEN='+avg.toFixed(2));
          console.log('TITLE_7_TO_11='+target+'/'+ALL.length+' ('+(target/ALL.length*100).toFixed(1)+'%)');
          console.log('TITLE_OVER_13='+over.length);
          console.log('SAME_CATEGORY_DUP='+sameCatDup);
          console.log('BAD_PHRASES='+bad.length);
          console.log('--- FINAL CATEGORY REVIEW ---');
          for(let ci=0;ci<C.length;ci++) console.log(String(ci).padStart(2,'0')+' '+C[ci][0]+' => '+ALL.filter(x=>x.ci===ci).slice(0,4).map(x=>x.title).join(' / '));
          if(ALL.length!==2048)process.exit(91);
          if(window.__PROMPTGPT_QA.minQuality<94)process.exit(92);
          if(punct.length||sameCatDup||bad.length||over.length)process.exit(93);
          if(target/ALL.length<0.92)process.exit(94);
          if(avg>9.8)process.exit(95);
          if(!ALL.every(p=>p.prompt.includes('【請交給我】')))process.exit(96);
          console.log('V6_2_FINAL_HUMAN_TITLE_QA=PASS');
          '''
          Path('/tmp/runtime.js').write_text('global.window={};\n'+segment+qa)
          PY
          node /tmp/compile.js
          node /tmp/runtime.js
      - name: Commit verified website
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- promptgpt/gemini.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add promptgpt/gemini.html
          git commit -m 'Polish PromptGPT titles for everyday users'
          git push
