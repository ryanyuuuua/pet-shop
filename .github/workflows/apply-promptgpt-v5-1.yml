name: Apply PromptGPT v5.1 Mode Matching

on:
  push:
    branches: [main]
    paths:
      - 'promptgpt/fix_mode_fit_v5_1.py'
      - '.github/workflows/apply-promptgpt-v5-1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  match:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply semantic mode matching
        run: python promptgpt/fix_mode_fit_v5_1.py
      - name: Verify sensible title combinations
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          h=Path('promptgpt/gemini.html').read_text()
          script=h.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/compile.js').write_text('new Function('+json.dumps(script)+'); console.log("FULL_SCRIPT_SYNTAX=PASS");')
          start=script.index('const C=')
          end=script.index('const ALL=buildLibrary();',start)+len('const ALL=buildLibrary();')
          segment=script[start:end]
          qa=r'''
          console.log('RUNTIME_ALL='+ALL.length);
          console.log('RUNTIME_QA='+JSON.stringify(window.__PROMPTGPT_QA));
          console.log('TITLE_SAMPLE='+ALL.slice(0,28).map(x=>x.title).join(' || '));
          if(ALL.length!==2048)process.exit(61);
          if(window.__PROMPTGPT_QA.minQuality<94)process.exit(62);
          const firstWebsite=ALL.filter(p=>p.ci===0).slice(0,4).map(x=>x.title).join('|');
          if(/整理流程|修復問題|查資料/.test(firstWebsite))process.exit(63);
          const debug=ALL.filter(p=>p.ci===4).slice(0,4).map(x=>x.title).join('|');
          if(!/修復問題/.test(debug))process.exit(64);
          console.log('SEMANTIC_MODE_MATCH_QA=PASS');
          '''
          Path('/tmp/runtime.js').write_text('global.window={};\n'+segment+qa)
          PY
          node /tmp/compile.js
          node /tmp/runtime.js
      - name: Commit website
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- promptgpt/gemini.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add promptgpt/gemini.html
          git commit -m 'Match PromptGPT title modes to each topic'
          git push
