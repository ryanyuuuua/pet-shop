name: Apply PromptGPT v6.3 Manual Cleanup

on:
  push:
    branches: [main]
    paths:
      - 'promptgpt/refine_titles_v6_3.py'
      - '.github/workflows/apply-promptgpt-title-v6-3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply manual title cleanup
        run: python promptgpt/refine_titles_v6_3.py
      - name: Verify final titles
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          h=Path('promptgpt/gemini.html').read_text()
          script=h.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/compile.js').write_text('new Function('+json.dumps(script)+'); console.log("FULL_SCRIPT_SYNTAX=PASS");')
          start=script.index('const C=')
          end=script.index('const ALL=buildLibrary();',start)+len('const ALL=buildLibrary();')
          seg=script[start:end]
          qa=r'''
          function vlen(s){return Array.from(String(s).replace(/\s+/g,'').replace(/[A-Za-z0-9.+#_-]+/g,'XX')).length}
          const avg=ALL.map(x=>vlen(x.title)).reduce((a,b)=>a+b,0)/ALL.length;
          const target=ALL.filter(x=>{const n=vlen(x.title);return n>=7&&n<=11}).length;
          const bad=ALL.filter(x=>/主角設計|產品主視覺|處理客服回覆模板|準備招聘職位介紹|履歷重寫|數學解題/.test(x.title));
          const sameCatDup=ALL.length-new Set(ALL.map(x=>x.ci+'|'+x.title)).size;
          console.log('RUNTIME_ALL='+ALL.length);
          console.log('TITLE_AVG='+avg.toFixed(2));
          console.log('TITLE_7_TO_11='+(target/ALL.length*100).toFixed(1)+'%');
          console.log('BAD='+bad.length);
          console.log('SAME_CAT_DUP='+sameCatDup);
          for(const ci of [7,25,29,30,37,47,56,57,63]) console.log(C[ci][0]+' => '+ALL.filter(x=>x.ci===ci).slice(0,4).map(x=>x.title).join(' / '));
          if(ALL.length!==2048||bad.length||sameCatDup||avg>9.8||target/ALL.length<0.92)process.exit(101);
          console.log('V6_3_FINAL_QA=PASS');
          '''
          Path('/tmp/runtime.js').write_text('global.window={};\n'+seg+qa)
          PY
          node /tmp/compile.js
          node /tmp/runtime.js
      - name: Commit verified website
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- promptgpt/gemini.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add promptgpt/gemini.html
          git commit -m 'Finish PromptGPT human title cleanup'
          git push
