              '<div class="navTitle">40 個專業分類</div>':'<div class="navTitle"><span id="catTotal">—</span> 個精選分類</div>',
              '<div class="badge">1000 條 · 40 大類 · Gemini Search</div>':'<div class="badge" id="heroStats">Curated Prompt Library · Gemini Search</div>',
              '<strong id="count">1000</strong>':'<strong id="count">0</strong>',
              '<footer>PromptGPT · 1000 Premium AI Prompts</footer>':'<footer>PromptGPT · Curated Premium AI Prompts</footer>',
              "localStorage.getItem('pg-fav')":"localStorage.getItem('pg-fav-v2')",
              "localStorage.setItem('pg-fav',":"localStorage.setItem('pg-fav-v2',",
              "$('#cats').innerHTML=C.map((c,i)=>`<button class=\"cat\" data-cat=\"${i}\"><span>${c[0]}</span><em>25</em></button>`).join('');":"const categoryCounts=C.map((_,i)=>ALL.filter(p=>p.ci===i).length);$('#cats').innerHTML=C.map((c,i)=>`<button class=\"cat\" data-cat=\"${i}\"><span>${c[0]}</span><em>${categoryCounts[i]}</em></button>`).join('');$('#allCount').textContent=ALL.length;$('#catTotal').textContent=C.length;$('#heroStats').textContent=`${ALL.length} 條精選 · ${C.length} 大類 · Gemini Search`;$('#libMeta').textContent=`${ALL.length} Curated Prompts`;"
          }
          for old,new in replacements.items():
              assert old in s, f'missing replacement target: {old[:80]}'
              s = s.replace(old,new,1)

          old = "const candidates=ALL.map(p=>[p,score(p,text)]).sort((a,b)=>b[1]-a[1]).slice(0,70).map(x=>x[0])"
          new = "const ranked=ALL.map(p=>[p,score(p,text)]).sort((a,b)=>b[1]-a[1]),top=ranked.slice(0,64).map(x=>x[0]),reps=C.map((_,ci)=>ranked.find(x=>x[0].ci===ci)?.[0]).filter(Boolean),candidates=[...new Map([...top,...reps].map(p=>[p.id,p])).values()].slice(0,128)"
          assert old in s, 'candidate selection target missing'
          s = s.replace(old,new,1)

          old_syn = "const syn={網站:'web website landing homepage 網頁 首頁 saas ui ux',作文:'寫作 writing essay 中文 英文 故事 文案',圖片:'image photo visual 攝影 插畫 product fashion logo',編程:'coding code frontend backend react nextjs debug 程式',商業:'business startup marketing sales strategy growth',影片:'video cinematic film motion 影片 電影',學習:'study learning tutor academic stem 補習 功課',設計:'design ui ux brand creative visual 設計'};"
          new_syn = "const syn={網站:'web website landing homepage saas ui ux 網頁 首頁 conversion',作文:'寫作 writing essay 中文 英文 narrative argumentative 文案',圖片:'image photo visual 攝影 插畫 product fashion logo advertising',編程:'coding code frontend backend react nextjs debug 程式 api database devops',商業:'business startup marketing sales strategy growth pricing monetization',影片:'video cinematic film motion storyboard youtube reel 影片 電影',學習:'study learning tutor academic stem exam revision 補習 功課',設計:'design ui ux brand creative visual packaging poster 設計',飲品:'beverage drink coffee tea soda product photography 飲料 咖啡 茶飲',食物:'food restaurant dish dessert photography 餐廳 美食',廣告:'advertising ad campaign social creative conversion 廣告 宣傳',自動化:'automation workflow agent no-code zapier make 自動 流程',研究:'research fact-check evidence source market user 研究 證據',簡報:'presentation pitch deck slide infographic 簡報 投影片',遊戲:'game gameplay level combat economy art 遊戲'};"
