          js_c = json.dumps(C, ensure_ascii=False, separators=(',',':'))
          js_m = json.dumps(M, ensure_ascii=False, separators=(',',':'))

          block = f'''const C={js_c};const M={js_m};
function _grams(s){{s=String(s||'').toLowerCase().normalize('NFKC').replace(/\\s+/g,'');const a=new Set();for(let i=0;i<s.length-1;i++)a.add(s.slice(i,i+2));return a}}
function _sim(a,b){{const A=_grams(a),B=_grams(b);if(!A.size||!B.size)return 0;let inter=0;for(const x of A)if(B.has(x))inter++;return inter/(A.size+B.size-inter)}}
function _pickModes(ci,fi){{const out=[];let x=(ci*7+fi*3)%M.length;for(let k=0;k<M.length&&out.length<4;k++){{const mi=(x+k*5)%M.length;if(!out.includes(mi))out.push(mi)}}return out}}
function makePrompt(ci,fi,mi,idNum){{const c=C[ci],m=M[mi],focus=c[5][fi],visual=c[4]==='visual',id='P'+String(idNum).padStart(4,'0');const vars=visual?'{{主體/產品}}、{{用途/平台}}、{{畫面比例}}、{{品牌/風格}}、{{必須出現}}、{{必須避免}}、{{光線/時間}}、{{參考但不可照抄元素}}':'{{目標}}、{{目標受眾}}、{{現況/素材}}、{{限制}}、{{成功指標}}、{{品牌/語氣}}、{{交付格式}}、{{期限/資源}}';const truth=visual?'不要捏造品牌資產、產品細節或文字內容；未知資訊用可替換 placeholder。':'不可把猜測寫成事實；資料不足時先標示假設，涉及外部事實要指出需要驗證的部分。';const special=visual?'對構圖、主體比例、鏡頭/視角、材質、光線、色彩、背景、負空間及平台裁切作具體控制。':'把策略落到可直接使用的文案、規格、步驟、表格、代碼或決策，不只講概念。';return{{id,ci,mi,fi,type:visual?'visual':'text',quality:96,title:`${{c[0]}} · ${{focus}} · ${{m[0]}}`,desc:`${{m[1]}}。專攻：${{focus}}。`,models:visual?'Gemini / ImageGen / Midjourney':'ChatGPT / Gemini / Claude',tags:[c[1],focus,m[0],visual?'Visual':'Text'],prompt:`你是一位${{c[3]}}。這不是腦暴任務，而是專業交付任務。你的專項是「${{focus}}」，工作模式是「${{m[0]}}」。

【任務目標】
${{m[1]}}。必須針對「${{focus}}」產出可以直接採用、交付、測試或上線的版本，並特別處理：${{c[2]}}。

【請先讀取的輸入】
${{vars}}

如果關鍵資料缺失：
1. 只問最多 3 個真正會改變方案的問題；
2. 如果不值得阻塞，就用明確標示的合理假設繼續；
3. 不可用空泛句子掩蓋資料不足。

【工作協議】
${{m[2]}}。
- 先寫成功標準與不可接受結果。
- 區分「必須做 / 建議做 / 暫不做」。
- 每個重大建議都要連到目標、證據或可驗證假設。
- ${{special}}
- 主動檢查邊界情況、手機/真實使用情境、可維護性與失敗模式。
- 提供至少 2 個有實質差異的替代方向，並說明何時應選另一個。
- ${{truth}}

【輸出契約】
請按以下順序輸出，不要省略：
A. 一句話結論：你建議做甚麼，以及最重要的取捨。
B. 成功標準：3–7 個可以驗收的條件。
C. 主要成品：完整可直接使用版本，不要只給 outline。
D. 決策與理由：只保留會影響結果的理由。
E. ${{m[3]}}。
F. 風險 / 邊界情況：至少 5 項，附處理方法。
G. 最終 QA：逐項檢查準確性、完整度、一致性、可執行性、平台適配與是否有無根據假設。
H. 下一步：列出最值得立即做的 3 件事。

【品質門檻】
- 具體：禁止「優化一下」「提升質感」但沒有可執行細節。
- 完整：主要成品不可叫使用者自己補完核心部分。
- 有判斷：不要平鋪所有選項，必須選出推薦方向。
- 可驗證：所有重要成果都應有驗收方式或成功指標。
- 不重複：不同段落不可換句話重講同一件事。
- 原創：可學習參考原理，但不可逐字或逐像素模仿特定作品。
- 自評低於 92/100 時，先自行修正再輸出。
- 不展示冗長內部思考，只輸出結論、必要理由、成品與可驗證證據。`}}}}
function _quality(p){{let q=84;if(p.prompt.length>1200)q+=4;if(p.prompt.includes('【輸出契約】'))q+=3;if(p.prompt.includes('風險 / 邊界情況'))q+=3;if(p.prompt.includes('最終 QA'))q+=3;if(p.prompt.includes('不可把猜測')||p.prompt.includes('不要捏造'))q+=2;if(p.prompt.includes('替代方向'))q+=1;return Math.min(q,100)}}
function curateLibrary(arr){{const kept=[],byCat=new Map(),rejected={{duplicate:0,quality:0}};for(const p of arr){{p.quality=_quality(p);if(p.quality<94){{rejected.quality++;continue}}const pool=byCat.get(p.ci)||[];if(pool.some(x=>_sim(x.title,p.title)>.965)){{rejected.duplicate++;continue}}pool.push(p);byCat.set(p.ci,pool);kept.push(p)}}window.__PROMPTGPT_QA={{generated:arr.length,kept:kept.length,rejected,categories:C.length,minQuality:kept.length?Math.min(...kept.map(x=>x.quality)):0}};return kept}}
function buildLibrary(){{const all=[];let id=1;for(let ci=0;ci<C.length;ci++)for(let fi=0;fi<C[ci][5].length;fi++)for(const mi of _pickModes(ci,fi))all.push(makePrompt(ci,fi,mi,id++));return curateLibrary(all)}}
const ALL=buildLibrary();'''

          pattern = r"const C=.*?const syn="
